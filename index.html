<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión Nínive · Desafío Bíblico sobre Jonás</title>

<style>
/* ========= CONFIGURACIÓN GLOBAL Y ESCALADO ARMÓNICO ========= */
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffd9e6 0%, #ffb6c9 35%, #f582ae 70%, #d9578f 100%);
    background-attachment: fixed;
    color: #5c1a3a;
    text-align: center;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

header {
    background: linear-gradient(135deg, #e0578f, #c8447a);
    padding: clamp(10px, 2vh, 25px) 15px;
    box-shadow: 0 4px 20px rgba(140,20,70,.35);
    position: relative;
    flex-shrink: 0;
    border-bottom: 4px solid #ffe0a3;
}

h1 {
    margin: 0;
    color: #fff3d6;
    font-size: clamp(1.3rem, 3.5vw, 2.5rem);
    text-shadow: 0 3px 4px rgba(0,0,0,0.25);
}

header p {
    margin: 5px 0 0 0;
    color: #ffe9f2;
    font-size: clamp(0.8rem, 1.5vw, 1.2rem);
}

#barra-progreso-contenedor {
    width: 100%;
    height: clamp(4px, 0.8vh, 8px);
    background: #7a1f4d;
    position: relative;
    flex-shrink: 0;
}

#barra-progreso {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd166, #ff6fa5);
    transition: width 0.4s ease;
}

/* ========= CONTENEDOR PRINCIPAL ========= */
#contenedor {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    padding: clamp(10px, 2vw, 30px);
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.fade-in {
    animation: fadeIn 0.4s ease forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========= ELEMENTOS DEL JUEGO ========= */
#nivel {
    font-size: clamp(1rem, 2vw, 1.5rem);
    color: #8a1150;
    margin-bottom: 6px;
    font-weight: bold;
}

#puntaje {
    font-size: clamp(1rem, 1.8vw, 1.4rem);
    margin-bottom: 10px;
    background: rgba(255,255,255,0.55);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    color: #8a1150;
    box-shadow: 0 2px 8px rgba(140,20,70,0.15);
}

#temporizador {
    font-size: clamp(2.2rem, 5vw, 4rem);
    color: #d9578f;
    margin-bottom: 10px;
    font-weight: bold;
    text-shadow: 0 0 12px rgba(217,87,143,0.4);
    line-height: 1;
}

.tiempo-critico {
    animation: pulso 0.9s infinite alternate;
    color: #c8102e !important;
}
@keyframes pulso {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

#pregunta {
    font-size: clamp(1.2rem, 2.8vw, 2.2rem);
    margin: clamp(10px, 2vh, 25px) 0;
    font-weight: 600;
    line-height: 1.35;
    color: #6d1240;
}

/* ========= OPCIONES Y BOTONES ESCALABLES ========= */
.opcion {
    display: block;
    width: 100%;
    max-width: 850px;
    margin: clamp(6px, 1.2vh, 14px) auto;
    padding: clamp(12px, 2vh, 20px);
    border: 2px solid #f2a6c4;
    border-radius: 14px;
    background: #fff5f9;
    color: #7a1f4d;
    font-size: clamp(1rem, 2vw, 1.35rem);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(140,20,70,0.1);
}

.opcion:hover:not(:disabled) {
    background: #ffe0ec;
    border-color: #d9578f;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(140,20,70,0.2);
}

.correcta {
    background: #6bbf8e !important;
    border-color: #6bbf8e !important;
    color: #ffffff !important;
}

.incorrecta {
    background: #e35d78 !important;
    border-color: #e35d78 !important;
    color: #ffffff !important;
}

button, .btn-accion {
    padding: clamp(8px, 1.5vh, 16px) clamp(16px, 2vw, 32px);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-size: clamp(0.9rem, 1.5vw, 1.2rem);
    background: linear-gradient(135deg, #ffd166, #ffb84d);
    color: #6d1240;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 3px 8px rgba(140,20,70,0.2);
}

button:hover:not(:disabled), .btn-accion:hover:not(:disabled) {
    background: linear-gradient(135deg, #ffe0a3, #ffd166);
    box-shadow: 0 4px 12px rgba(140,20,70,0.3);
}

#siguiente {
    display: none;
    background: linear-gradient(135deg, #ff8fb3, #e0578f);
    color: #fff3d6;
    font-size: clamp(1.1rem, 2vw, 1.5rem);
    padding: clamp(10px, 1.8vh, 18px) clamp(20px, 3vw, 40px);
    margin-top: 15px;
}

.panel-comodines {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.comodin {
    background: linear-gradient(135deg, #ffe0a3, #ffd166);
    color: #6d1240;
    font-weight: bold;
    border-radius: 20px;
    padding: clamp(6px, 1vh, 10px) clamp(12px, 1.5vw, 20px);
    font-size: clamp(0.85rem, 1.3vw, 1.1rem);
}

#resultado {
    margin-top: 15px;
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: bold;
    color: #6d1240;
}

.caja-explicacion {
    background: rgba(255, 245, 249, 0.95);
    border-left: 5px solid #d9578f;
    padding: clamp(10px, 1.5vh, 18px);
    margin: 15px auto;
    max-width: 850px;
    border-radius: 0 8px 8px 0;
    text-align: left;
    font-size: clamp(0.9rem, 1.6vw, 1.15rem);
    line-height: 1.4;
    color: #6d1240;
    box-shadow: 0 2px 10px rgba(140,20,70,0.12);
}

.btn-fullscreen {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #ffe0a3, #ffd166);
    color: #6d1240;
    border: none;
    padding: 8px 14px;
    font-size: clamp(0.75rem, 1.2vw, 0.95rem);
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.caja-votacion-envivo {
    background: linear-gradient(135deg, #fff0f6, #ffe0ec);
    padding: clamp(12px, 2vh, 20px);
    border-radius: 12px;
    margin: 15px auto;
    max-width: 650px;
    box-shadow: 0 6px 20px rgba(140,20,70,0.25);
    border: 2px solid #ffd166;
    color: #6d1240;
}

#ranking {
    margin-top: 20px;
    background: rgba(255,255,255,0.5);
    padding: 15px;
    border-radius: 10px;
    font-size: clamp(0.9rem, 1.5vw, 1.1rem);
    color: #6d1240;
}

.input-nombre {
    padding: 12px;
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    border-radius: 8px;
    border: 2px solid #f2a6c4;
    background: #fff5f9;
    color: #6d1240;
    margin-bottom: 15px;
    width: 80%;
    max-width: 320px;
    text-align: center;
}

.bono-aviso {
    color: #2a8a5f;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    font-weight: bold;
    display: block;
    margin-top: 5px;
}

/* ========= NUEVA IDENTIDAD VISUAL: MISIÓN NÍNIVE ========= */
:root {
    --noche: #081522;
    --panel: rgba(15, 36, 56, 0.86);
    --panel-claro: rgba(24, 52, 77, 0.9);
    --turquesa: #55ead1;
    --turquesa-profundo: #17bfa9;
    --coral: #ff8d70;
    --lavanda: #a99cff;
    --texto: #edfaff;
    --texto-suave: #9bb2c4;
}

html { background: var(--noche); }

body {
    background:
        radial-gradient(circle at 8% 10%, rgba(85, 234, 209, 0.15), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(169, 156, 255, 0.18), transparent 30%),
        radial-gradient(circle at 50% 110%, rgba(255, 141, 112, 0.15), transparent 36%),
        var(--noche);
    color: var(--texto);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body::before,
body::after { display: none; }

header {
    background: linear-gradient(135deg, rgba(10, 31, 51, 0.97), rgba(28, 47, 76, 0.97));
    border-bottom: 2px solid var(--turquesa);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
    padding: clamp(18px, 3vh, 32px) 15px;
}

.logo-esquina {
    position: absolute;
    top: 12px;
    left: 18px;
    width: 58px;
    height: 58px;
    padding: 4px;
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
}

header h1,
header p { padding-left: 72px; padding-right: 72px; }

h1 {
    color: var(--texto);
    letter-spacing: 0.04em;
    text-shadow: 0 0 22px rgba(85, 234, 209, 0.16);
}

header p { color: var(--texto-suave); }

#barra-progreso-contenedor { height: 7px; background: #10283c; }

#barra-progreso {
    background: linear-gradient(90deg, var(--turquesa), var(--lavanda), var(--coral));
    box-shadow: 0 0 16px rgba(85, 234, 209, 0.55);
}

#contenedor {
    max-width: 980px;
    margin: clamp(18px, 4vh, 45px) auto;
    padding: clamp(20px, 4vw, 44px);
    border: 1px solid rgba(143, 193, 214, 0.18);
    border-radius: 28px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
}

#nivel,
#puntaje { color: var(--turquesa) !important; }

#puntaje {
    background: rgba(85, 234, 209, 0.1);
    border: 1px solid rgba(85, 234, 209, 0.2);
    box-shadow: none;
}

#temporizador {
    color: var(--coral);
    text-shadow: 0 0 22px rgba(255, 141, 112, 0.38);
}

#pregunta {
    color: var(--texto) !important;
    font-weight: 700;
    letter-spacing: -0.02em;
}

#contenedor h1,
#contenedor h2,
#contenedor h3,
#contenedor p { color: var(--texto) !important; }

#contenedor > .fade-in > div[style*="color"] {
    color: var(--turquesa) !important;
}

.opcion {
    max-width: 780px;
    border: 1px solid rgba(143, 193, 214, 0.22);
    background: var(--panel-claro);
    color: var(--texto);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    text-align: left;
}

.opcion:hover:not(:disabled) {
    background: rgba(36, 78, 101, 0.95);
    border-color: var(--turquesa);
    box-shadow: 0 8px 24px rgba(85, 234, 209, 0.14);
}

.correcta { background: #168b78 !important; border-color: var(--turquesa) !important; }
.incorrecta { background: #b94e56 !important; border-color: var(--coral) !important; }

button,
.btn-accion {
    background: linear-gradient(135deg, var(--turquesa), var(--turquesa-profundo));
    color: #06221f;
    box-shadow: 0 8px 18px rgba(23, 191, 169, 0.2);
}

button:hover:not(:disabled),
.btn-accion:hover:not(:disabled) {
    background: linear-gradient(135deg, #91f6e5, var(--turquesa));
    box-shadow: 0 10px 24px rgba(85, 234, 209, 0.28);
}

#siguiente {
    background: linear-gradient(135deg, var(--coral), #ee668b);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 141, 112, 0.24);
}

.panel-comodines { margin: 20px 0; }

.comodin {
    background: rgba(169, 156, 255, 0.16);
    border: 1px solid rgba(169, 156, 255, 0.5);
    color: #ddd8ff;
    box-shadow: none;
}

.comodin:hover:not(:disabled) { background: rgba(169, 156, 255, 0.3); }

#resultado,
.caja-explicacion,
#ranking { color: var(--texto) !important; }

.caja-explicacion,
#ranking {
    background: rgba(8, 21, 34, 0.7);
    border-color: var(--turquesa);
    box-shadow: none;
}

.caja-explicacion strong,
.bono-aviso { color: var(--turquesa) !important; }

.input-nombre {
    border: 1px solid rgba(85, 234, 209, 0.4);
    background: rgba(8, 21, 34, 0.8);
    color: var(--texto);
}

.input-nombre::placeholder { color: #6f899d; }

.btn-fullscreen {
    background: rgba(169, 156, 255, 0.2);
    border: 1px solid rgba(169, 156, 255, 0.45);
    color: #eeeaff;
    box-shadow: none;
}

@media (max-width: 600px) {
    #contenedor { width: calc(100% - 20px); border-radius: 20px; }
    .logo-esquina { top: 10px; left: 10px; width: 48px; height: 48px; }
    header h1,
    header p { padding-left: 58px; padding-right: 58px; }
}

@media (max-width: 600px) {
    header { padding: 12px 5px; }
    .btn-fullscreen { position: relative; right: auto; top: auto; transform: none; margin-top: 6px; display: inline-block; }
}
</style>
</head>
