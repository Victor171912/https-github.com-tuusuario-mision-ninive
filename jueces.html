<!DOCTYPE html>
<html lang="es">
<head>

<style>
/* ========= CONFIGURACIÓN GLOBAL Y ESCALADO ARMÓNICO ========= */
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #8EB9FC, #1b263b);
    color: white;
    text-align: center;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

header {
    background: #FC765D;
    padding: clamp(10px, 2vh, 25px) 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    position: relative;
    flex-shrink: 0;
}

h1 {
    margin: 0;
    color: #ffd186;
    font-size: clamp(1.3rem, 3.5vw, 2.5rem);
    text-shadow: 0 3px 4px rgba(0,0,0,0.3);
}

header p {
    margin: 5px 0 0 0;
    color: #ffffff;
    font-size: clamp(0.8rem, 1.5vw, 1.2rem);
}

#barra-progreso-contenedor {
    width: 100%;
    height: clamp(4px, 0.8vh, 8px);
    background: #1b263b;
    position: relative;
    flex-shrink: 0;
}

#barra-progreso {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd166, #ff6b6b);
    transition: width 0.4s ease;
}

/* ========= CONTENEDOR PRINCIPAL ========= */
#contenedor {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    padding: clamp(10px, 2vw, 30px);
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.fade-in {
    animation: fadeIn 0.4s ease forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========= ELEMENTOS DEL JUEGO ========= */
#nivel {
    font-size: clamp(1rem, 2vw, 1.5rem);
    color: #ffd166;
    margin-bottom: 6px;
    font-weight: bold;
}

#puntaje {
    font-size: clamp(1rem, 1.8vw, 1.4rem);
    margin-bottom: 10px;
    background: rgba(255,255,255,0.08);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
}

#temporizador {
    font-size: clamp(2.2rem, 5vw, 4rem);
    color: #ff6b6b;
    margin-bottom: 10px;
    font-weight: bold;
    text-shadow: 0 0 12px rgba(255,107,107,0.4);
    line-height: 1;
}

.tiempo-critico {
    animation: pulso 0.9s infinite alternate;
    color: #ff3333 !important;
}
@keyframes pulso {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

#pregunta {
    font-size: clamp(1.2rem, 2.8vw, 2.2rem);
    margin: clamp(10px, 2vh, 25px) 0;
    font-weight: 600;
    line-height: 1.35;
}

/* ========= OPCIONES Y BOTONES ESCALABLES ========= */
.opcion {
    display: block;
    width: 100%;
    max-width: 850px;
    margin: clamp(6px, 1.2vh, 14px) auto;
    padding: clamp(12px, 2vh, 20px);
    border: 2px solid #415a77;
    border-radius: 12px;
    background: #1b263b;
    color: white;
    font-size: clamp(1rem, 2vw, 1.35rem);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.opcion:hover:not(:disabled) {
    background: #415a77;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
}

.correcta {
    background: #2a9d8f !important;
    border-color: #2a9d8f !important;
}

.incorrecta {
    background: #e63946 !important;
    border-color: #e63946 !important;
}

button, .btn-accion {
    padding: clamp(8px, 1.5vh, 16px) clamp(16px, 2vw, 32px);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-size: clamp(0.9rem, 1.5vw, 1.2rem);
    background: #e0e1dd;
    color: #0d1b2a;
    font-weight: bold;
    transition: all 0.2s;
}

button:hover:not(:disabled), .btn-accion:hover:not(:disabled) {
    background: #ffffff;
    box-shadow: 0 4px 10px rgba(255,255,255,0.2);
}

#siguiente, #terminar-fallo {
    display: none;
    background: #ffd166;
    color: #0d1b2a;
    font-size: clamp(1.1rem, 2vw, 1.5rem);
    padding: clamp(10px, 1.8vh, 18px) clamp(20px, 3vw, 40px);
    margin-top: 15px;
}

.panel-comodines {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.comodin {
    background: #ffd166;
    color: black;
    font-weight: bold;
    border-radius: 20px;
    padding: clamp(6px, 1vh, 10px) clamp(12px, 1.5vw, 20px);
    font-size: clamp(0.85rem, 1.3vw, 1.1rem);
}

#resultado {
    margin-top: 15px;
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: bold;
}

.caja-explicacion {
    background: rgba(13, 27, 42, 0.9);
    border-left: 5px solid #ffd166;
    padding: clamp(10px, 1.5vh, 18px);
    margin: 15px auto;
    max-width: 850px;
    border-radius: 0 8px 8px 0;
    text-align: left;
    font-size: clamp(0.9rem, 1.6vw, 1.15rem);
    line-height: 1.4;
    color: #e0e1dd;
}

.btn-fullscreen {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: #ffd166;
    color: #0d1b2a;
    border: none;
    padding: 8px 14px;
    font-size: clamp(0.75rem, 1.2vw, 0.95rem);
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.caja-votacion-envivo {
    background: linear-gradient(135deg, #2b2d42, #1b263b);
    padding: clamp(12px, 2vh, 20px);
    border-radius: 12px;
    margin: 15px auto;
    max-width: 650px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    border: 2px solid #ffd166;
}

#ranking {
    margin-top: 20px;
    background: #1b263b;
    padding: 15px;
    border-radius: 10px;
    font-size: clamp(0.9rem, 1.5vw, 1.1rem);
}

.input-nombre {
    padding: 12px;
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    border-radius: 8px;
    border: 2px solid #415a77;
    background: #0d1b2a;
    color: white;
    margin-bottom: 15px;
    width: 80%;
    max-width: 320px;
    text-align: center;
}

.bono-aviso {
    color: #2a9d8f;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    font-weight: bold;
    display: block;
    margin-top: 5px;
}

@media (max-width: 600px) {
    header { padding: 12px 5px; }
    .btn-fullscreen { position: relative; right: auto; top: auto; transform: none; margin-top: 6px; display: inline-block; }
}

/* ========= IDENTIDAD VISUAL MISIÓN NÍNIVE ========= */
:root {
    --noche: #081522;
    --panel: rgba(15, 36, 56, 0.86);
    --panel-claro: rgba(24, 52, 77, 0.9);
    --turquesa: #55ead1;
    --turquesa-profundo: #17bfa9;
    --coral: #ff8d70;
    --lavanda: #a99cff;
    --texto: #edfaff;
    --texto-suave: #9bb2c4;
}

html { background: var(--noche); }
body {
    position: relative;
    background: linear-gradient(135deg, rgba(8, 21, 34, .94), rgba(8, 21, 34, .8)), var(--noche);
    color: var(--texto);

}
body::before {
    position: fixed;
    z-index: -2;
    inset: -30px;
    content: "";
    background: url("logo.png") center / cover no-repeat;

    opacity: .18;
    transform: scale(1.08);
}
body::after {
    position: fixed;
    z-index: -1;
    inset: 0;
    content: "";
    background: radial-gradient(circle at 8% 10%, rgba(85, 234, 209, .14), transparent 28%), radial-gradient(circle at 92% 12%, rgba(169, 156, 255, .16), transparent 30%);
    pointer-events: none;
}
header {
    position: relative;
    width: 100%;
    max-width: none;
    margin-bottom: 0;
    padding: clamp(18px, 3vh, 32px) 15px;
    border: 0;
    border-bottom: 2px solid var(--turquesa);
    border-radius: 0;
    background: linear-gradient(135deg, rgba(10, 31, 51, .97), rgba(28, 47, 76, .97));
    box-shadow: 0 10px 35px rgba(0, 0, 0, .3);
}
header h1 { color: var(--texto); text-shadow: 0 0 22px rgba(85, 234, 209, .16); }
header p { color: var(--texto-suave); }
.logo-esquina { position: absolute; top: 12px; left: 18px; width: 58px; height: 58px; padding: 4px; object-fit: contain; border: 1px solid rgba(255, 255, 255, .5); border-radius: 50%; background: rgba(255, 255, 255, .95); box-shadow: 0 5px 18px rgba(0, 0, 0, .25); }
.btn-portada { position: absolute; top: 16px; left: 88px; padding: 8px 13px; color: var(--texto); border: 1px solid rgba(85, 234, 209, .35); border-radius: 9px; background: rgba(85, 234, 209, .1); font-size: 12px; font-weight: 700; text-decoration: none; }
#barra-progreso-contenedor { height: 7px; background: #10283c; }
#barra-progreso { background: linear-gradient(90deg, var(--turquesa), var(--lavanda), var(--coral)); box-shadow: 0 0 16px rgba(85, 234, 209, .55); }
#contenedor { width: min(980px, calc(100% - 28px)); max-width: 980px; margin: clamp(18px, 4vh, 45px) auto; padding: clamp(20px, 4vw, 44px); border: 1px solid rgba(143, 193, 214, .18); border-radius: 28px; background: var(--panel); box-shadow: 0 24px 70px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .06); backdrop-filter: blur(16px); }
#nivel, #puntaje { color: var(--turquesa) !important; }
#puntaje { background: rgba(85, 234, 209, .1); border: 1px solid rgba(85, 234, 209, .2); box-shadow: none; }
#temporizador { color: var(--coral); text-shadow: 0 0 22px rgba(255, 141, 112, .38); }
#pregunta { color: var(--texto) !important; font-weight: 700; }
.opcion { max-width: 780px; border: 1px solid rgba(143, 193, 214, .22); background: var(--panel-claro); color: var(--texto); box-shadow: 0 8px 20px rgba(0, 0, 0, .16); text-align: left; }
.opcion:hover:not(:disabled) { background: rgba(36, 78, 101, .95); border-color: var(--turquesa); box-shadow: 0 8px 24px rgba(85, 234, 209, .14); }
.correcta { background: #168b78 !important; border-color: var(--turquesa) !important; }
.incorrecta { background: #b94e56 !important; border-color: var(--coral) !important; }
button, .btn-accion { background: linear-gradient(135deg, var(--turquesa), var(--turquesa-profundo)); color: #06221f; box-shadow: 0 8px 18px rgba(23, 191, 169, .2); }
button:hover:not(:disabled), .btn-accion:hover:not(:disabled) { background: linear-gradient(135deg, #91f6e5, var(--turquesa)); box-shadow: 0 10px 24px rgba(85, 234, 209, .28); }
#siguiente { background: linear-gradient(135deg, var(--coral), #ee668b); color: white; }
.comodin { background: rgba(169, 156, 255, .16); border: 1px solid rgba(169, 156, 255, .5); color: #ddd8ff; box-shadow: none; }
#resultado, .caja-explicacion, #ranking { color: var(--texto) !important; }
.caja-explicacion, #ranking { background: rgba(8, 21, 34, .7); border-color: var(--turquesa); box-shadow: none; }
.input-nombre { border: 1px solid rgba(85, 234, 209, .4); background: rgba(8, 21, 34, .8); color: var(--texto); }
.input-nombre::placeholder { color: #6f899d; }

@media (max-width: 600px) {
    .logo-esquina { top: 10px; left: 10px; width: 48px; height: 48px; }
    .btn-portada { top: 12px; left: 68px; }
    header h1, header p { padding-left: 70px; padding-right: 10px; }
}
</style>
</head>

<body>

<header>
    <img class="logo-esquina" src="logo.png" alt="Logo Creciendo en amor para servir a otros">
    <a class="btn-portada" href="index.html">← Portada</a>
    <h1>MISIÓN JUECES</h1>
    <p>Desafío bíblico · El Libro de Jueces</p>
    <button class="btn-fullscreen" onclick="toggleFullscreen()">📺 Pantalla Completa</button>
</header>
<div id="barra-progreso-contenedor"><div id="barra-progreso"></div></div>

<div id="contenedor" class="fade-in"></div>

<script>

/* ========= BANCOS SEPARADOS POR NIVELES ========= */
const preguntasFacil = [
    { pregunta:"¿Qué tribu subió primero a pelear contra los cananeos? (1:1-3)", opciones:["Judá","Benjamín","Efraín","Dan"], correcta:0, explicacion:"Jueces 1:1-2 - 'Judá subirá; he aquí que yo he entregado la tierra en sus manos'." },
    { pregunta:"¿A quién le cortaron los pulgares de las manos y de los pies? (1:4-7)", opciones:["Adoni-bezec","Eglón","Sísara","Zeba"], correcta:0, explicacion:"Jueces 1:6-7 - Le prendieron a Adoni-bezec y le cortaron los pulgares de las manos y de los pies." },
    { pregunta:"¿A quién se le dio la hija de Caleb para casarse? (1:12-15)", opciones:["Otoniel","Gedeón","Aod","Barac"], correcta:0, explicacion:"Jueces 1:12-13 - Caleb dio a su hija Acsa por mujer a Otoniel." },
    { pregunta:"¿Qué fue lo que Judá, Benjamín, Manasés, Efraín, Zabulón, Aser y Neftalí fallaron en hacer? (1:16-36)", opciones:["Arrojar a los habitantes de sus tierras","Construir altares","Celebrar la pascua","Escoger un rey"], correcta:0, explicacion:"Jueces 1:19-36 - Las tribus no expulsaron por completo a los cananeos de sus territorios." },
    { pregunta:"¿Qué se levantó después de que Josué y los ancianos murieron? (2:6-10)", opciones:["Otra generación que no conocía al Señor","Un gran avivamiento","Un ejército invencible","Una nueva dinastía"], correcta:0, explicacion:"Jueces 2:10 - 'Se levantó después de ellos otra generación que no conocía a Jehová'." },
    { pregunta:"¿Qué hicieron los hijos de Israel que provocó la ira del Señor? (2:11-13)", opciones:["Dejaron al Señor y adoraron a Baal y a Astarot","Huyeron a Egipto","Se dividieron en dos reinos","Destruyeron el tabernáculo"], correcta:0, explicacion:"Jueces 2:11-13 - Dejaron a Jehová y sirvieron a los Baales y a las imágenes de Astarot." },
    { pregunta:"¿A quién levantó el Señor para ayudar a librarles de los que les despojaban? (2:16-18)", opciones:["Jueces","Reyes","Profetas","Sacerdotes"], correcta:0, explicacion:"Jueces 2:16 - 'Jehová levantó jueces que los librasen de mano de los que les despojaban'." },
    { pregunta:"¿Qué juez libró a Israel de las manos del rey de Mesopotamia? (3:7-11)", opciones:["Otoniel","Jefté","Gedeón","Samgar"], correcta:0, explicacion:"Jueces 3:9-10 - Otoniel prevaleció contra el rey de Mesopotamia." },
    { pregunta:"¿Físicamente, qué era diferente en Aod? (3:12-16)", opciones:["Era zurdo","Era muy alto","Tenía fuerza sobrehumana","Era ciego"], correcta:0, explicacion:"Jueces 3:15 - Aod hijo de Gera, benjamita, era zurdo." },
    { pregunta:"¿Físicamente, qué era diferente en Eglón rey de Moab? (3:17-26)", opciones:["Era un hombre muy grueso (obeso)","Tenía seis dedos en cada pie","Era ciego de un ojo","Era un gigante"], correcta:0, explicacion:"Jueces 3:17 - 'Y entregó el presente a Eglón rey de Moab; y era Eglón hombre muy grueso'." },
    { pregunta:"¿Qué medios usó Samgar para matar a los filisteos? (3:31)", opciones:["Una aguijada de bueyes (quijada de buey)","Una lanza de bronce","Una estaca de madera","Una espada"], correcta:0, explicacion:"Jueces 3:31 - Hirió a seiscientos hombres de los filisteos con una aguijada de bueyes." },
    { pregunta:"¿Quién oprimió a los israelitas con novecientos carros herrados? (4:1-3)", opciones:["Jabín / Sísara","Eglón","Adoni-bezec","Madián"], correcta:0, explicacion:"Jueces 4:2-3 - Sísara, capitán del ejército de Jabín, tenía 900 carros herrados." },
    { pregunta:"¿Qué mujer gobernó a Israel? (4:4)", opciones:["Débora","Jael","Rut","Ana"], correcta:0, explicacion:"Jueces 4:4 - Gobernaba en aquel tiempo a Israel una mujer, Débora, profetisa." },
    { pregunta:"¿Quién tomó una estaca de la tienda y la metió por las sienes de Sísara? (4:12-23)", opciones:["Jael","Débora","Dalila","Noemí"], correcta:0, explicacion:"Jueces 4:21 - Jael, mujer de Heber, tomó una estaca de la tienda y un martillo y se la hincó en las sienes." },
    { pregunta:"¿Qué hicieron Débora y Barac después de la victoria? (5:1-31)", opciones:["Cantaron al Señor","Lloraron en Silo","Construyeron un palacio","Pusieron un rey"], correcta:0, explicacion:"Jueces 5:1 - Aquel día cantó Débora con Barac hijo de Abinoam." },
    { pregunta:"¿Por qué maldijo el ángel de Jehová a Meroz? (5:23)", opciones:["Por no venir al socorro de Jehová","Por idolatría","Por robar el botín","Por matar a los profetas"], correcta:0, explicacion:"Jueces 5:23 - 'Maldecid a Meroz... porque no vinieron al socorro de Jehová'." }
];

const preguntasMedio = [
    { pregunta:"¿Qué fue lo que la madre de Sísara gritó a voces desde la ventana? (5:24-28)", opciones:["¿Por qué tarda su carro en venir? ¿Por qué se detienen las ruedas?","¿Dónde está mi hijo?","¡Hemos ganado la batalla!","¡Maldito sea Israel!"], correcta:0, explicacion:"Jueces 5:28 - La madre de Sísara miraba por la ventana y decía: ¿Por qué tarda su carro en venir?" },
    { pregunta:"¿Dónde se le apareció el ángel de Jehová a Gedeón? (6:11)", opciones:["Junto al lagar donde estaba sacudiendo el trigo","En el monte Horeb","En el tabernáculo","En el río Jordán"], correcta:0, explicacion:"Jueces 6:11 - Se sentó bajo la encina en Ofra mientras Gedeón sacudía el trigo en el lagar." },
    { pregunta:"¿Qué le dijo el ángel a Gedeón? (6:12)", opciones:["El Señor está contigo, varón esforzado y valiente","No temas, pequeño pueblo","Huye a los montes","Construye un arca"], correcta:0, explicacion:"Jueces 6:12 - El ángel le dijo: 'Jehová está contigo, varón esforzado y valiente'." },
    { pregunta:"¿Cómo se llamó el altar edificado por Gedeón? (6:24)", opciones:["Jehová-shalom","Jehová-jireh","Jehová-nissi","Jehová-rafá"], correcta:0, explicacion:"Jueces 6:24 - Edificó allí Gedeón altar a Jehová, y lo llamó Jehová-shalom." },
    { pregunta:"¿Qué le preguntó Gedeón al ángel? (6:13-15)", opciones:["Si el Señor está con nosotros, ¿por qué nos ha sobrevenido todo esto?","¿Cuál es tu nombre?","¿Cuándo morirá el rey?","¿Dónde está mi familia?"], correcta:0, explicacion:"Jueces 6:13 - Cuestionó por qué sufrían si Dios estaba con ellos." },
    { pregunta:"¿Qué hicieron Gedeón y sus diez siervos de noche? (6:25-28)", opciones:["Derribaron el altar de Baal y cortaron la imagen de Asera","Huyeron a Madián","Robaron el tesoro del rey","Atacaron el campamento"], correcta:0, explicacion:"Jueces 6:27 - Gedeón tomó diez hombres de sus siervos y derribó el altar de Baal." },
    { pregunta:"¿Qué señal le dio Dios a Gedeón para mostrarle que salvaría a Israel? (6:36-40)", opciones:["Un vellón de lana","Una columna de fuego","Una piedra encendida","Una vara florida"], correcta:0, explicacion:"Jueces 6:37-40 - La prueba del vellón de lana seco y mojado con el rocío." },
    { pregunta:"¿Cuántos hombres dejaron a Gedeón porque estaban temerosos? (7:1-3)", opciones:["22,000 hombres","10,000 hombres","5,000 hombres","300 hombres"], correcta:0, explicacion:"Jueces 7:3 - Se regresaron del monte de Galaad veintidós mil hombres." },
    { pregunta:"¿Cuántos hombres pasaron la prueba de las aguas? (7:4-8)", opciones:["300 hombres","100 hombres","1,000 hombres","10,000 hombres"], correcta:0, explicacion:"Jueces 7:7 - Fueron trescientos hombres los que lamieron el agua llevando la mano a la boca." },
    { pregunta:"¿Qué escuchó Gedeón cuando fue al campamento de los Madianitas? (7:9-15)", opciones:["Un hombre contó un sueño sobre un pan de cebada y otro lo interpretó","Un plan para huir","Música de celebración","Una oración a Dios"], correcta:0, explicacion:"Jueces 7:13-14 - Escuchó sobre un pan de cebada que rodó y derribó una tienda." },

/* ========= AUDIO ========= */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(tipo) {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    const now = audioCtx.currentTime;

    if (tipo === 'correcto') {
        [440, 554.37, 659.25, 880].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.15, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
        });
    } else if (tipo === 'incorrecto') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.4);
    } else if (tipo === 'comodin') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.25);
    } else if (tipo === 'tic') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.04);
    } else if (tipo === 'ganar') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.12);
            gain.gain.setValueAtTime(0.2, now + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.4);
        });
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            alert(`Pantalla completa no disponible: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

function mezclar(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

/* ========= TEMPORIZADOR ========= */
function iniciarTemporizador(segundos) {
    detenerTemporizador();
    tiempoRestante = segundos;
    tiempoObjetivo = performance.now() + (segundos * 1000);
    relojPausado = false;

    intervaloPreciso = setInterval(() => {
        if (relojPausado) return;

        const ahora = performance.now();
        const diferencia = Math.ceil((tiempoObjetivo - ahora) / 1000);
        tiempoRestante = Math.max(0, diferencia);

        const tempElement = document.getElementById("temporizador");
        if (tempElement) {
            tempElement.innerText = tiempoRestante;
            if (tiempoRestante <= 5 && tiempoRestante > 0) {
                tempElement.classList.add("tiempo-critico");
                playSound('tic');
            } else {
                tempElement.classList.remove("tiempo-critico");
            }
        }

        if (tiempoRestante <= 0) {
            detenerTemporizador();
            procesarTiempoAgotado();
        }
    }, 200);
}

function pausarTemporizador() {
    if (!relojPausado) { relojPausado = true; }
}

function reanudarTemporizador() {
    if (relojPausado) {
        tiempoObjetivo = performance.now() + (tiempoRestante * 1000);
        relojPausado = false;
    }
}

function agregarTiempo(segundosExtra) {
    tiempoRestante += segundosExtra;
    tiempoObjetivo += (segundosExtra * 1000);
    const tempElement = document.getElementById("temporizador");
    if (tempElement) tempElement.innerText = tiempoRestante;
}

function detenerTemporizador() {
    if (intervaloPreciso) {
        clearInterval(intervaloPreciso);
        intervaloPreciso = null;
    }
}

function validarYComenzar() {
    const input = document.getElementById("nombreInput").value.trim();
    if(input === "") { alert("Por favor, introduce tu nombre."); return; }
    nombreJugador = input;
    audioCtx.resume();
    iniciarJuego();
}

function iniciarJuego(){
    // Mezcla independientemente cada nivel para aleatorizar el orden dentro del nivel
    const facilesMezcladas = mezclar(preguntasFacil);
    const mediosMezclados = mezclar(preguntasMedio);
    const dificilesMezcladas = mezclar(preguntasDificil);

    // Une las 3 listas secuencialmente por dificultad
    const bancoMezclado = [...facilesMezcladas, ...mediosMezclados, ...dificilesMezcladas];

    // Mapea las preguntas barajando también las opciones
    juego = bancoMezclado.map(p => {
        const textoCorrecta = p.opciones[p.correcta];
        const opcionesMezcladas = mezclar(p.opciones);
        return { 
            pregunta: p.pregunta, 
            opciones: opcionesMezcladas, 
            correcta: opcionesMezcladas.indexOf(textoCorrecta),
            explicacion: p.explicacion
        };
    });

    indice = 0; puntaje = 0;

    document.getElementById("contenedor").innerHTML = `
        <div class="fade-in">
            <div id="nivel"></div>
            <div id="puntaje">Puntaje: 0</div>
            <div id="temporizador">30</div>
            
            <div class="panel-comodines">
                <button id="c5050" class="comodin" onclick="usar5050()">50 / 50</button>
                <button id="cCongregacion" class="comodin" onclick="usarCongregacion()">👥 Congregación (+45s)</button>
                <button id="cBiblia" class="comodin" onclick="usarBiblia()">📖 Biblia (+30s)</button>
            </div>

            <div id="pregunta"></div>
            <div id="opciones-contenedor">
                <div id="opciones"></div>
            </div>
            <div id="visual-comodin"></div>
            <div id="resultado"></div>
            <button id="siguiente" onclick="avanzarPregunta()">Siguiente Pregunta</button>
            <button id="terminar-fallo" onclick="finJuego()">Continuar</button>
        </div>
    `;
    mostrarPregunta();
}

function mostrarPregunta(){
    document.getElementById("barra-progreso").style.width = `${(indice / juego.length) * 100}%`;
    document.getElementById("opciones").style.display = "block";

    const p = juego[indice];
    document.getElementById("nivel").innerText = `Pregunta ${indice+1} de ${juego.length}`;
    document.getElementById("puntaje").innerHTML = `Puntaje: <strong>${puntaje}</strong>`;
    document.getElementById("pregunta").innerText = p.pregunta;

    let html="";
    p.opciones.forEach((o,i)=>{ html += `<button class="opcion" onclick="responder(${i})">${o}</button>`; });

    document.getElementById("opciones").innerHTML = html;
    document.getElementById("resultado").innerHTML = "";
    document.getElementById("visual-comodin").innerHTML = "";
    document.getElementById("siguiente").style.display = "none";
    document.getElementById("terminar-fallo").style.display = "none";
    actualizarVisualComodines();

    iniciarTemporizador(30);
}

function actualizarVisualComodines() {
    if(usado5050) { document.getElementById("c5050").disabled = true; document.getElementById("c5050").style.opacity = "0.3"; }
    if(usadoCongregacion) { document.getElementById("cCongregacion").disabled = true; document.getElementById("cCongregacion").style.opacity = "0.3"; }
    if(usadoBiblia) { document.getElementById("cBiblia").disabled = true; document.getElementById("cBiblia").style.opacity = "0.3"; }
}

function responder(op){
    detenerTemporizador();
    const p = juego[indice];
    const botones = document.querySelectorAll(".opcion");
    botones.forEach(b => b.disabled = true);

    if(op === p.correcta){
        playSound('correcto');
        let basePuntos = 100;
        let textoBono = "";
        if (tiempoRestante >= 23) {
            let bono = 20;
            basePuntos += bono;
            textoBono = `<span class="bono-aviso">⚡ ¡Bono de Velocidad! +${bono} pts</span>`;
        }
        botones[op].classList.add("correcta");
        puntaje += basePuntos;
        document.getElementById("puntaje").innerHTML = `Puntaje: <strong>${puntaje}</strong>`;
        document.getElementById("resultado").innerHTML = `
            ✅ ¡Respuesta Correcta! ${textoBono}
            <div class="caja-explicacion">💡 <strong>Cita Bíblica:</strong> ${p.explicacion}</div>
        `;
        document.getElementById("siguiente").style.display = "inline-block";
    }else{
        playSound('incorrecto');
        botones[op].classList.add("incorrecta");
        botones[p.correcta].classList.add("correcta");
        document.getElementById("resultado").innerHTML = `
            ❌ Respuesta Incorrecta.<br>La opción correcta era: <strong>${p.opciones[p.correcta]}</strong>
            <div class="caja-explicacion">💡 <strong>Cita Bíblica:</strong> ${p.explicacion}</div>
        `;
        document.getElementById("terminar-fallo").style.display = "inline-block";
    }
}

function procesarTiempoAgotado() {
    playSound('incorrecto');
    const p = juego[indice];
    document.getElementById("resultado").innerHTML = `
        ⏱️ ¡Tiempo agotado!<br>La respuesta correcta era: <strong>${p.opciones[p.correcta]}</strong>
        <div class="caja-explicacion">💡 <strong>Cita Bíblica:</strong> ${p.explicacion}</div>
    `;
    document.querySelectorAll(".opcion").forEach(b => b.disabled = true);
    document.querySelectorAll(".opcion")[p.correcta].classList.add("correcta");
    document.getElementById("terminar-fallo").style.display = "inline-block";
}

function avanzarPregunta(){
    indice++;
    if(indice >= juego.length){ ganar(); return; }
    const contenedor = document.getElementById("contenedor");
    contenedor.classList.remove("fade-in");
    void contenedor.offsetWidth;
    contenedor.classList.add("fade-in");
    mostrarPregunta();
}

/* ========= COMODINES ========= */
function usar5050(){
    if(usado5050) return;
    usado5050 = true; 
    playSound('comodin'); 
    actualizarVisualComodines();
    
    const p = juego[indice];
    const botones = document.querySelectorAll(".opcion");
    let incorrectas=[];
    for(let i=0; i<p.opciones.length; i++){
        if(i!==p.correcta){ incorrectas.push(i); }
    }
    incorrectas = mezclar(incorrectas);
    botones[incorrectas[0]].style.visibility="hidden";
    botones[incorrectas[1]].style.visibility="hidden";
}

/* ========= RANKING ========= */
function guardarRanking(){
    let ranking = JSON.parse(localStorage.getItem("jueces_v47")) || [];
    ranking.push({ nombre: nombreJugador, puntaje: puntaje });
    ranking.sort((a,b) => b.puntaje - a.puntaje);
    ranking = ranking.slice(0,5);
    localStorage.setItem("jueces_v47", JSON.stringify(ranking));
}

function mostrarRanking(){
    let ranking = JSON.parse(localStorage.getItem("jueces_v47")) || [];
    let html="";
    if(ranking.length === 0) { html = "<li>Nadie ha jugado aún. ¡Inaugura la lista!</li>"; } 
    else { ranking.forEach(r=>{ html += `<li><strong>${r.nombre}</strong>: ${r.puntaje} Pts</li>`; }); }
    document.getElementById("listaRanking").innerHTML=html;
}

    detenerTemporizador();
    playSound('ganar');
    guardarRanking();
    document.getElementById("barra-progreso").style.width = "100%";
    document.getElementById("contenedor").innerHTML= `
        <div class="fade-in">
            <h1 style="font-size: clamp(2rem, 5vw, 3.5rem); color:#ffd166;">🏆 ¡DESAFÍO COMPLETADO!</h1>
            <h2>Felicidades, ${nombreJugador.toUpperCase()}. Has respondido las 47 preguntas del libro de Jueces.</h2>
            <h3>Puntaje Acumulado: <span style="color:#ffd166; font-size: clamp(1.5rem, 3vw, 2.5rem);">${puntaje} Pts</span></h3>
            <button onclick="mostrarPantallaInicio()" style="margin-top:20px;">Volver al Inicio</button>
        </div>
    `;
}

function finJuego(){
    detenerTemporizador();
    guardarRanking();
    document.getElementById("contenedor").innerHTML= `
        <div class="fade-in">
            <h1 style="font-size: clamp(1.8rem, 4vw, 3rem);">Fin del Juego</h1>
            <h3>Buen intento, ${nombreJugador}. Llegaste a la pregunta ${indice + 1} de 47.</h3>
            <h2>Puntaje total: <span style="color:#ffd166;">${puntaje} Pts</span></h2>
            <button onclick="mostrarPantallaInicio()" style="margin-top:20px;">Intentar nuevamente</button>
        </div>
    `;
}

mostrarPantallaInicio();
</script>
